name: ansi_escape_codes
description: A toolkit for working with ANSI escape codes and analyzing strings
  containing them.
version: 4.0.1
repository: https://github.com/vi-k/ansi_escape_codes
issue_tracker: https://github.com/vi-k/ansi_escape_codes/issues

topics:
  - ansi
  - escape-codes
  - console
  - color
  - cli

environment:
  sdk: ^3.6.0

dependencies:
  # The floor is 1.15.0 and stays there: Flutter pins meta to an exact
  # version out of its own SDK, and Flutter 3.27 — the line that carries
  # Dart 3.6, the floor declared above — pins 1.15.0. A `^1.16.0`
  # constraint therefore failed version solving on that line and lifted
  # the real Flutter floor to 3.29, one Dart version above what this
  # package claims to support. Nothing here needs the newer meta: the
  # annotations used are `@immutable`, `@internal` and `@visibleForTesting`,
  # and all three are older than 1.15.0.
  meta: ^1.15.0

dev_dependencies:
  # Never imported: tool/check_entry_points.dart reads the export
  # namespace of every entry point through it. Held at 7 because 8 asks
  # for an SDK above the ^3.6.0 floor above, and a dev dependency that
  # cannot resolve at the floor takes that whole leg of the CI down. The
  # price is test 1.26 instead of the latest — test_core past 0.6.12
  # wants analyzer 8 — so the two move together when the floor rises.
  analyzer: ^7.7.1
  # Never imported: its format_coverage turns a test run into the lcov
  # report the workflow measures its coverage floor against.
  coverage: ^1.11.1
  lints: ">=5.1.1 <7.0.0"
  test: ^1.25.15
