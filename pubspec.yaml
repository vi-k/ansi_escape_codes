name: ansi_escape_codes
description: A toolkit for working with ANSI escape codes and analyzing strings
  containing them.
version: 4.0.0
repository: https://github.com/vi-k/ansi_escape_codes
issue_tracker: https://github.com/vi-k/ansi_escape_codes/issues

topics:
  - ansi
  - escape-codes
  - console
  - color
  - cli

environment:
  sdk: ^3.6.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  # Never imported: its format_coverage turns a test run into the lcov
  # report the workflow measures its coverage floor against.
  coverage: ^1.11.1
  lints: ^5.1.1
  test: ^1.25.15
