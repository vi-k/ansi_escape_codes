# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: ansi_escape_codes

on:
  # The wave branches are here so that the gate stands before `main` and not
  # after it. A wave is verified locally on one SDK; the 3.6.0 leg of the
  # matrix is the floor the package claims to support and nothing local runs
  # it, so without this the first time anything sees it is a push to `main` —
  # and by then a red is already there. Prefixes, not `**`: dependabot
  # branches arrive with a pull request and would otherwise run twice.
  push:
    branches: [ "main", "feat/**", "fix/**", "perf/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound of the sdk constraint in pubspec.yaml, so that the
        # package is known to build on what it says it supports, and the
        # current stable.
        sdk: [ 3.6.0, stable ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1  # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Check every entry point exports the names its signatures use
        # A hand-written list of exports cannot notice what is missing
        # from it; this walks the export namespace of each lib/*.dart and
        # answers every declaration its public signatures reach.
        run: dart run tool/check_entry_points.dart

      - name: Check the generated tables are in step with the generator
        run: |
          dart run tool/generate.dart
          git diff --exit-code -- lib/

      - name: Run tests
        run: dart test

      - name: Check a parse keeps no more memory than it did
        if: matrix.sdk == 'stable'
        # A cold process, a fixed corpus, and a band around what a parsed
        # match retains — benchmark/memory_guard.dart carries the figures and
        # says how to move them. The stable SDK only: the band was calibrated
        # on one Dart, and an older one reading the same corpus differently
        # would be a way to go red without anything being wrong.
        run: dart run benchmark/memory_guard.dart

      - name: Check parser operations keep their expected complexity
        if: matrix.sdk == 'stable'
        # Wall-clock ratios need their own warmed process. The stable SDK
        # only: benchmark/complexity_guard.dart carries the calibrated corpus,
        # paired medians and bands, which do not describe a different Dart.
        run: dart run benchmark/complexity_guard.dart

      - name: Check the docs build
        run: dart doc --dry-run

      - name: Run the examples
        # Every example there is, so that a new one cannot be forgotten here.
        # utils.dart is left out: it is the titles the other examples
        # import, a library with no main of its own to run.
        run: |
          for f in example/*.dart; do
            if [ "$f" = "example/utils.dart" ]; then continue; fi
            timeout 60 dart run "$f" > /dev/null < /dev/null
          done

      - name: Collect coverage
        if: matrix.sdk == 'stable'
        run: dart test --coverage=coverage

      - name: Format coverage reports
        if: matrix.sdk == 'stable'
        run: |
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.gated.info --report-on=lib --ignore-files='**/style_colors.dart'

      - name: Check hand-written lib coverage holds its floor
        if: matrix.sdk == 'stable'
        # style_colors.dart is generated code. Keep it in the full artifact
        # for diagnosis, but permanently exclude it from this hand-written
        # coverage gate.
        run: |
          awk -F: -v floor=95.0 '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            /^DA:/ {
              lineFound++
              split($2, line, ",")
              if (line[2] != 0) {
                lineHit++
              }
            }
            END {
              if (found == 0) {
                print "the report counted no lines at all"
                exit 1
              }
              if (found != lineFound || hit != lineHit) {
                print "the report summaries do not match its line records"
                exit 1
              }
              pct = 100 * hit / found
              # Three decimals, not one: the boundary is where this gate
              # does its work, and %.1f prints the same "95.0%" for the
              # run that passes and the run just under it that does not.
              printf "coverage of hand-written lib/: %.3f%% (%d of %d lines), floor %.1f%%\n",
                  pct, hit, found, floor
              if (pct < floor) {
                print "the coverage has fallen through the floor"
                exit 1
              }
            }
          ' coverage/lcov.gated.info

      - name: Upload coverage
        if: always() && matrix.sdk == 'stable'
        # The step above it is the one that can fail, and a floor that has
        # just been fallen through is exactly when the report is worth
        # reading. `always()` keeps the artifact for that run; with nothing
        # collected — a failure earlier than this — the upload finds no files
        # and says so without going red.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: coverage/

      - name: Check the package is publishable
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
