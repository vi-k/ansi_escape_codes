# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: ansi_escape_codes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound of the sdk constraint in pubspec.yaml, so that the
        # package is known to build on what it says it supports, and the
        # current stable.
        sdk: [ 3.6.0, stable ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1  # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Check the generated tables are in step with the generator
        run: |
          dart run tool/generate.dart
          git diff --exit-code -- lib/

      - name: Run tests
        run: dart test

      - name: Check the docs build
        run: dart doc --dry-run

      - name: Run the examples
        # Every example there is, so that a new one cannot be forgotten here.
        # utils.dart is left out: it is the titles the other examples
        # import, a library with no main of its own to run.
        run: |
          for f in example/*.dart; do
            if [ "$f" = "example/utils.dart" ]; then continue; fi
            timeout 60 dart run "$f" > /dev/null < /dev/null
          done

      - name: Collect coverage
        if: matrix.sdk == 'stable'
        run: dart test --coverage=coverage

      - name: Check the coverage holds its floor
        if: matrix.sdk == 'stable'
        # The floor sits under the current figure rather than at it: the
        # generated style_colors.dart is covered at 0.4% by design and pulls
        # lib/ as a whole down from 97.5% to 76.0%.
        run: |
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          awk -F: -v floor=75.0 '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END {
              if (found == 0) {
                print "the report counted no lines at all"
                exit 1
              }
              pct = 100 * hit / found
              printf "coverage of lib/: %.1f%% (%d of %d lines), floor %.1f%%\n",
                  pct, hit, found, floor
              if (pct < floor) {
                print "the coverage has fallen through the floor"
                exit 1
              }
            }
          ' coverage/lcov.info

      - name: Upload coverage
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: coverage/

      - name: Check the package is publishable
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
