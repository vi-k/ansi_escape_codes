# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: ansi_escape_codes

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound of the sdk constraint in pubspec.yaml, so that the
        # package is known to build on what it says it supports, and the
        # current stable.
        sdk: [ 3.6.0, stable ]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: dart-lang/setup-dart@9a04e6d73cca37bd455e0608d7e5092f881fd603  # v1.0.0
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Check the generated tables are in step with the generator
        run: |
          dart run tool/generate.dart
          git diff --exit-code -- lib/

      - name: Run tests
        run: dart test

      - name: Check the docs build
        run: dart doc --dry-run

      - name: Run the examples
        # utils.dart is left out: it is the titles the other examples
        # import, a library with no main of its own to run.
        run: |
          for f in example/ansi_escape_codes_example.dart \
                   example/check_compatibility.dart \
                   example/colors256.dart \
                   example/control.dart \
                   example/links.dart \
                   example/progress_indicator.dart \
                   example/rgb.dart \
                   example/styles.dart; do
            timeout 60 dart run "$f" > /dev/null
          done

      - name: Collect coverage
        if: matrix.sdk == 'stable'
        run: dart test --coverage=coverage

      - name: Upload coverage
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: coverage/

      - name: Check the package is publishable
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
