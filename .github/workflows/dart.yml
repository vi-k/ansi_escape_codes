# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: ansi_escape_codes

on:
  # Every branch but dependabot's, so that the gate stands before `main`
  # and not after it. A wave is verified locally on one SDK; the 3.6.0 leg
  # of the matrix is the floor the package claims to support and nothing
  # local runs it, so a branch that reaches `main` unchecked takes a red
  # there with it.
  #
  # A deny-list rather than the allow-list this was: an allow-list opens
  # outwards. It held `main`, `feat/**`, `fix/**` and `perf/**`, and a
  # branch named anything else — `docs/`, `chore/`, `test/` — ran no CI at
  # all and read as if it had. The one exclusion has its own reason:
  # dependabot's branches arrive with a pull request and would otherwise
  # be built twice.
  push:
    branches-ignore: [ "dependabot/**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound of the sdk constraint in pubspec.yaml, so that the
        # package is known to build on what it says it supports, and the
        # current stable.
        sdk: [ 3.6.0, stable ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1  # v1.8.0
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Check the two readmes still say the same thing
        # AGENTS.md calls a divergence between README.md and README.ru.md a
        # defect and asks for both in one commit, and nothing enforced it.
        # Headings, code blocks, the code under their comments and where
        # those comments stand are compared; the prose and the text of the
        # comments are translated and are not.
        run: dart run tool/check_readme_sync.dart

      - name: Check every entry point analyses, closes and matches its snapshot
        # A hand-written list of exports cannot notice what is missing
        # from it; this walks the export namespace of each lib/*.dart and
        # answers every declaration its public signatures reach, then holds
        # each namespace against tool/entry_point_names.json. Both read an
        # element model, so the whole of lib/ is swept for analysis errors
        # and warnings first: a library that fails to analyse still has a
        # model, only a smaller one, and a smaller one reads as an entry
        # point that exports fewer names. --update-snapshot is never passed
        # here; it is for an accepted API diff, by hand.
        run: dart run tool/check_entry_points.dart

      - name: Check the generated tables are in step with the generator
        run: |
          dart run tool/generate.dart
          git diff --exit-code -- lib/

      - name: Run tests
        run: dart test

      - name: Check a parse keeps no more memory than it did
        if: matrix.sdk == 'stable'
        # A cold process, a fixed corpus, and a band around what a parsed
        # match retains — benchmark/memory_guard.dart carries the figures and
        # says how to move them. The stable SDK only: the band was calibrated
        # on one Dart, and an older one reading the same corpus differently
        # would be a way to go red without anything being wrong.
        run: dart run benchmark/memory_guard.dart

      - name: Check parser operations keep their expected complexity
        if: matrix.sdk == 'stable'
        # Wall-clock ratios need their own warmed process. Each side reads
        # the work it produced before the timing series and again after it,
        # and the band is shown the median of the paired ratios. The stable
        # SDK only: benchmark/complexity_guard.dart carries the calibrated
        # corpus and bands, which do not describe a different Dart.
        run: dart run benchmark/complexity_guard.dart

      - name: Check the docs build
        run: dart doc --dry-run

      - name: Run the examples
        # Every example there is, so that a new one cannot be forgotten here.
        # utils.dart is left out: it is the titles the other examples
        # import, a library with no main of its own to run.
        run: |
          for f in example/*.dart; do
            if [ "$f" = "example/utils.dart" ]; then continue; fi
            timeout 60 dart run "$f" > /dev/null < /dev/null
          done

      - name: Collect coverage
        if: matrix.sdk == 'stable'
        run: dart test --coverage=coverage

      - name: Format coverage reports
        if: matrix.sdk == 'stable'
        run: |
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.info --report-on=lib
          dart run coverage:format_coverage \
            --lcov --in=coverage --out=coverage/lcov.gated.info --report-on=lib --ignore-files='**/style_colors.dart'

      - name: Check the coverage report holds its floor and its files
        if: matrix.sdk == 'stable'
        # Two answers over the two reports the step above wrote. The floor
        # is measured over the gated report, which leaves out the generated
        # style_colors.dart; the file set is measured over the full one,
        # because a file excluded from the floor still has to be there at
        # all. format_coverage builds from the hitmap of the run, so a
        # library nothing loaded leaves no record and no floor can see it.
        run: dart run tool/check_coverage.dart

      - name: Upload coverage
        if: always() && matrix.sdk == 'stable'
        # The step above it is the one that can fail, and a floor that has
        # just been fallen through is exactly when the report is worth
        # reading. `always()` keeps the artifact for that run; with nothing
        # collected — a failure earlier than this — the upload finds no files
        # and says so without going red.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage
          path: coverage/

      - name: Check the package is publishable
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
